name: Contribution snake

on:
  schedule:
    - cron: "0 4 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#0d1117&color_dots=#ebedf0,#f5eeb0,#ecdf86,#e6db74,#b8a93f
            dist/snake-dark.svg?palette=github-dark&color_snake=#e6db74&color_dots=#161b22,#3b3a1f,#6b6530,#a89f45,#e6db74

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
